services:
  postgres:
    image: postgres:16
    container_name: base-plenaguard
    restart: always
    environment:
      POSTGRES_USER: plena_user
      POSTGRES_PASSWORD: plena_password
      POSTGRES_DB: plena_db
    ports:
      - "5432:5432"
    volumes:
      - plenaguard_postgres_data:/var/lib/postgresql/data
      - ./tablas.sql:/docker-entrypoint-initdb.d/1-tablas.sql
      - ./datos.sql:/docker-entrypoint-initdb.d/2-datos.sql

volumes:
  plenaguard_postgres_data: